<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Ordbog">
<title>丹麦语单词本</title>
<style>
:root{--bg:#f4f6f8;--card:#fff;--ink:#1b1f2a;--mute:#6a7280;--line:#dde2e8;--red:#c8102e;--sea:#2f5d7c;--soft:#e9eef3;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#14181f;--card:#1e242d;--ink:#e8ecf1;--mute:#98a2b0;--line:#323b47;--red:#ef4a63;--sea:#7fb0d3;--soft:#28313c;color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.55 -apple-system,"PingFang SC","Segoe UI",sans-serif;padding:env(safe-area-inset-top) 0 calc(72px + env(safe-area-inset-bottom))}
main{max-width:560px;margin:0 auto;padding:16px}
h2{font-size:15px;margin:0 0 8px;color:var(--mute);font-weight:600}
textarea,input{width:100%;font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:10px}
textarea{min-height:130px;resize:vertical}
button{font:inherit;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;padding:9px 14px;cursor:pointer}
button.pri{background:var(--red);border-color:var(--red);color:#fff}
button:focus-visible,input:focus-visible,textarea:focus-visible,summary:focus-visible{outline:2px solid var(--sea);outline-offset:2px}
.row{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.mute{color:var(--mute);font-size:14px}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;border:0;border-radius:0;background:none;padding:14px 0;color:var(--mute)}
nav button.on{color:var(--red);font-weight:700}
section{display:none}section.on{display:block}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px;margin:10px 0}
.word{font:600 34px/1.2 "Iowan Old Style",Georgia,serif;margin:0}
.tag{display:inline-block;background:var(--soft);color:var(--sea);border-radius:6px;padding:1px 8px;font-size:13px;margin-right:6px}
.ipa{color:var(--mute);margin-left:6px}
.say{padding:2px 9px;margin-left:6px;font-size:14px}
.forms{display:grid;grid-template-columns:auto 1fr;gap:2px 14px;margin:10px 0;font-size:15px}
.forms b{color:var(--sea);font-weight:600}
.ex{border-left:3px solid var(--red);padding-left:10px;margin:8px 0}
.ex div:last-child{color:var(--mute);font-size:14px}
details{background:var(--card);border:1px solid var(--line);border-radius:10px;margin:8px 0;padding:10px 14px}
summary{cursor:pointer;font-weight:600}
.grade{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}
.log{font-size:14px;margin-top:8px;white-space:pre-wrap}
.err{color:var(--red)}
</style>
</head>
<body>
<main>
<section id="t-add" class="on">
  <h2>添加单词</h2>
  <textarea id="words" placeholder="每行一个词，变形也可以（如 spiste、bilerne），会自动还原成原形"></textarea>
  <div class="row"><button class="pri" id="go">生成词条</button><button id="stop">停止</button></div>
  <div class="log" id="log"></div>
</section>

<section id="t-lib">
  <h2 id="libh">词库</h2>
  <input id="q" placeholder="搜索丹麦语或中文">
  <div id="list"></div>
</section>

<section id="t-rev">
  <h2 id="revh">复习</h2>
  <div id="rev"></div>
</section>

<section id="t-set">
  <h2>设置</h2>
  <p class="mute">Gemini API key 只保存在这台设备的浏览器里，不会上传到别处。</p>
  <input id="key" type="password" placeholder="Gemini API key" autocomplete="off">
  <p></p>
  <input id="model" placeholder="模型名">
  <div class="row"><button class="pri" id="save">保存设置</button></div>
  <h2>备份</h2>
  <p class="mute">iPhone 上网页数据可能被系统清理，请定期导出备份。</p>
  <div class="row"><button id="exp">导出 JSON</button><button id="imp">导入 JSON</button></div>
  <input id="file" type="file" accept=".json" hidden>
  <div class="log" id="setlog"></div>
</section>
</main>

<nav>
  <button data-t="add" class="on">添加</button>
  <button data-t="lib">词库</button>
  <button data-t="rev">复习</button>
  <button data-t="set">设置</button>
</nav>

<script>
const $ = s => document.querySelector(s);
const KEY = 'dk_vocab_v1';
let S = { cards: [], settings: { key: '', model: 'gemini-2.5-flash' } };
let stopFlag = false, queue = [], cur = null, flipped = false;

try { const r = localStorage.getItem(KEY); if (r) S = Object.assign(S, JSON.parse(r)); } catch (e) {}
function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) { alert('保存失败，请先导出备份'); } }
const esc = t => String(t ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const sleep = ms => new Promise(r => setTimeout(r, ms));

/* ---------- 标签页 ---------- */
function tab(t) {
  document.querySelectorAll('section').forEach(s => s.classList.toggle('on', s.id === 't-' + t));
  document.querySelectorAll('nav button').forEach(b => b.classList.toggle('on', b.dataset.t === t));
  if (t === 'lib') renderLib();
  if (t === 'rev') startReview();
}
document.querySelectorAll('nav button').forEach(b => b.onclick = () => tab(b.dataset.t));

/* ---------- 发音 ---------- */
let warned = false;
function speak(t) {
  try {
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(t);
    u.lang = 'da-DK'; u.rate = 0.9;
    const v = speechSynthesis.getVoices().find(v => v.lang.replace('_', '-').toLowerCase().startsWith('da'));
    if (v) u.voice = v;
    else if (!warned) { warned = true; alert('没有找到丹麦语语音。请在 iPhone「设置 → 辅助功能 → 朗读内容 → 声音 → 丹麦语」下载一个。'); }
    speechSynthesis.speak(u);
  } catch (e) {}
}
document.addEventListener('click', e => { const b = e.target.closest('[data-say]'); if (b) speak(b.dataset.say); });
const sayBtn = t => `<button class="say" data-say="${esc(t)}" aria-label="朗读">🔊</button>`;

/* ---------- 调用 Gemini ---------- */
async function gen(word) {
  const prompt = `你是严谨的丹麦语词典。词条：“${word}”。如果它是变形，请还原为原形（lemma）。只返回 JSON，格式：
{"lemma":"","pos":"名词/动词/形容词/副词/…","gender":"en 或 et 或 null","ipa":"","meaning_zh":"","meaning_en":"","forms":[{"label":"","value":""}],"examples":[{"da":"","zh":""}],"collocations":[{"da":"","zh":""}],"note":""}
规则：名词的 forms 含 单数定指、复数不定、复数定指；动词含 不定式、现在时、过去时、完成时（带 har/er）、命令式；形容词含 中性(-t)、复数/定指(-e)、比较级、最高级；其他词性 forms 可为空数组。例句 2-3 个，难度 A1-B1，中文翻译自然；搭配 2-4 个。变形不确定时在 note 里说明。`;
  for (let i = 0; i < 3; i++) {
    const r = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(S.settings.model)}:generateContent`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'x-goog-api-key': S.settings.key },
      body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }], generationConfig: { responseMimeType: 'application/json', temperature: 0.3 } })
    });
    if (r.status === 429) { await sleep(15000); continue; }
    if (!r.ok) throw new Error('API ' + r.status + '：' + (await r.text()).slice(0, 120));
    const j = await r.json();
    const txt = j.candidates?.[0]?.content?.parts?.map(p => p.text).join('') || '';
    return JSON.parse(txt.replace(/```json|```/g, '').trim());
  }
  throw new Error('请求太频繁（429），稍后再试');
}

$('#go').onclick = async () => {
  if (!S.settings.key) { alert('请先在「设置」里填写 Gemini API key'); return tab('set'); }
  const words = [...new Set($('#words').value.split(/\n+/).map(w => w.trim()).filter(Boolean))];
  if (!words.length) return;
  stopFlag = false; $('#go').disabled = true;
  const log = $('#log'); log.textContent = ''; let ok = 0;
  for (let i = 0; i < words.length && !stopFlag; i++) {
    log.textContent += `(${i + 1}/${words.length}) ${words[i]} … `;
    try {
      const d = await gen(words[i]);
      if (S.cards.some(c => c.lemma.toLowerCase() === String(d.lemma).toLowerCase())) log.textContent += `已存在：${d.lemma}\n`;
      else { S.cards.push(Object.assign(d, { id: Date.now() + i, added: Date.now(), ease: 2.5, interval: 0, reps: 0, due: 0, new: true })); save(); ok++; log.textContent += `✓ ${d.lemma}\n`; }
    } catch (e) { log.innerHTML += `<span class="err">失败：${esc(e.message)}</span>\n`; }
    await sleep(800);
  }
  log.textContent += `\n完成，新增 ${ok} 个。`;
  $('#go').disabled = false; $('#words').value = '';
};
$('#stop').onclick = () => stopFlag = true;

/* ---------- 卡片渲染 ---------- */
function front(c) {
  return `<p class="word">${esc(c.lemma)}${sayBtn(c.lemma)}</p><div class="mute">${esc(c.ipa || '')}</div>`;
}
function back(c) {
  const forms = (c.forms || []).map(f => `<b>${esc(f.label)}</b><span>${esc(f.value)}${f.value ? sayBtn(f.value) : ''}</span>`).join('');
  const ex = (c.examples || []).map(x => `<div class="ex"><div>${esc(x.da)}${sayBtn(x.da)}</div><div>${esc(x.zh)}</div></div>`).join('');
  const col = (c.collocations || []).map(x => `<div class="ex"><div>${esc(x.da)}</div><div>${esc(x.zh)}</div></div>`).join('');
  return `<div><span class="tag">${esc(c.pos)}</span>${c.gender && c.gender !== 'null' ? `<span class="tag">${esc(c.gender)}</span>` : ''}</div>
  <p><b>${esc(c.meaning_zh)}</b><br><span class="mute">${esc(c.meaning_en)}</span></p>
  ${forms ? `<div class="forms">${forms}</div>` : ''}
  ${ex ? `<h2>例句</h2>${ex}` : ''}${col ? `<h2>搭配</h2>${col}` : ''}
  ${c.note ? `<p class="mute">${esc(c.note)}</p>` : ''}`;
}

/* ---------- 词库 ---------- */
function renderLib() {
  const q = $('#q').value.trim().toLowerCase();
  const cs = S.cards.filter(c => !q || (c.lemma + c.meaning_zh + c.meaning_en).toLowerCase().includes(q)).sort((a, b) => b.added - a.added);
  $('#libh').textContent = `词库（${S.cards.length}）`;
  $('#list').innerHTML = cs.length ? cs.map(c => `<details><summary>${esc(c.lemma)} <span class="mute">${esc(c.meaning_zh)}</span></summary>
    <p class="word" style="font-size:26px">${esc(c.lemma)}${sayBtn(c.lemma)}<span class="ipa" style="font-size:15px">${esc(c.ipa || '')}</span></p>${back(c)}
    <div class="row"><button data-del="${c.id}">删除</button></div></details>`).join('')
    : '<p class="mute">还没有单词。去「添加」页粘贴一些词吧。</p>';
}
$('#q').oninput = renderLib;
$('#list').addEventListener('click', e => {
  const b = e.target.closest('[data-del]');
  if (b && confirm('删除这张卡片？')) { S.cards = S.cards.filter(c => c.id != b.dataset.del); save(); renderLib(); }
});

/* ---------- 复习（简化 SM-2） ---------- */
function startReview() {
  const now = Date.now();
  const due = S.cards.filter(c => !c.new && c.due <= now).sort((a, b) => a.due - b.due);
  const fresh = S.cards.filter(c => c.new).slice(0, 20);
  queue = [...due, ...fresh]; next();
}
function next() {
  cur = queue.shift(); flipped = false;
  const left = S.cards.filter(c => !c.new && c.due > Date.now()).length;
  $('#revh').textContent = `复习（剩 ${queue.length + (cur ? 1 : 0)}）`;
  if (!cur) { $('#rev').innerHTML = `<div class="card"><p><b>今天的复习完成了。</b></p><p class="mute">之后还有 ${left} 张卡片排在未来复习。</p></div>`; return; }
  drawCard();
}
function drawCard() {
  $('#rev').innerHTML = `<div class="card">${front(cur)}${flipped ? '<hr style="border:0;border-top:1px solid var(--line);margin:14px 0">' + back(cur) : ''}</div>` +
    (flipped ? `<div class="grade"><button data-g="0">忘了</button><button data-g="1">模糊</button><button data-g="2">记得</button><button data-g="3">很熟</button></div>`
      : `<button class="pri" style="width:100%" id="flip">显示答案</button>`);
  if ($('#flip')) $('#flip').onclick = () => { flipped = true; drawCard(); };
}
$('#rev').addEventListener('click', e => {
  const b = e.target.closest('[data-g]'); if (!b || !cur) return;
  const g = +b.dataset.g, c = cur, now = Date.now();
  if (g === 0) { c.reps = 0; c.interval = 0; c.ease = Math.max(1.3, c.ease - 0.2); c.due = now + 60000; c.new = false; queue.push(c); }
  else {
    if (g === 1) { c.interval = Math.max(1, Math.round((c.interval || 1) * 1.2)); c.ease = Math.max(1.3, c.ease - 0.15); }
    if (g === 2) c.interval = c.reps === 0 ? 1 : c.reps === 1 ? 3 : Math.round(c.interval * c.ease);
    if (g === 3) { c.interval = c.reps === 0 ? 3 : Math.round(Math.max(c.interval, 1) * c.ease * 1.3); c.ease += 0.15; }
    c.reps++; c.new = false; c.due = now + c.interval * 864e5;
  }
  save(); next();
});

/* ---------- 设置与备份 ---------- */
$('#key').value = S.settings.key; $('#model').value = S.settings.model;
$('#save').onclick = () => { S.settings.key = $('#key').value.trim(); S.settings.model = $('#model').value.trim() || 'gemini-2.5-flash'; save(); $('#setlog').textContent = '已保存。'; };
$('#exp').onclick = () => {
  const d = Object.assign({}, S, { settings: { model: S.settings.model } });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([JSON.stringify(d, null, 1)], { type: 'application/json' }));
  a.download = 'danish-vocab-' + new Date().toISOString().slice(0, 10) + '.json'; a.click();
};
$('#imp').onclick = () => $('#file').click();
$('#file').onchange = async e => {
  try {
    const d = JSON.parse(await e.target.files[0].text()); let n = 0;
    (d.cards || []).forEach(c => { if (!S.cards.some(x => x.lemma === c.lemma)) { S.cards.push(c); n++; } });
    save(); $('#setlog').textContent = `导入 ${n} 张新卡片。`;
  } catch (err) { $('#setlog').textContent = '导入失败：文件格式不对'; }
};
</script>
</body>
</html>
